<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker></defs>
<style>.b{fill:#131824;stroke:#263042;stroke-width:2}.t{fill:#e6e9ef}.k{fill:#8b96a8;font-size:10px}.e{stroke:#9aa3b5;stroke-width:1.5;fill:none;marker-end:url(#a)}.d{stroke-dasharray:5 4}.l{fill:#9aa3b5;font-size:10px}.h{fill:#1a2233;stroke:#e8b04b}.q{fill:#1a1420;stroke:#e85a4b}.p{fill:#0f1a16;stroke:#4be89a}</style>
<rect x="330" y="10" width="300" height="56" rx="4" class="b h"/><text x="480" y="32" text-anchor="middle" class="t">Humans: Carolina (owner), the signer of the brief</text><text x="480" y="50" text-anchor="middle" class="k">set intent · edit rules, sources, personas · merge PRs · sign</text>
<rect x="330" y="110" width="300" height="56" rx="4" class="b"/><text x="480" y="132" text-anchor="middle" class="t">Conductor: the scheduled runtime</text><text x="480" y="150" text-anchor="middle" class="k">CURATION.md · routines 11:00 / 23:00 UTC · dry-run replay</text>
<rect x="20" y="110" width="250" height="56" rx="4" class="b p"/><text x="145" y="132" text-anchor="middle" class="t">Envoy gateway: fetch_news.py</text><text x="145" y="150" text-anchor="middle" class="k">allowlist only (sources.json, 38 feeds, 9 languages)</text>
<rect x="20" y="210" width="250" height="56" rx="4" class="b q"/><text x="145" y="232" text-anchor="middle" class="t">Reader (quarantined): news.json + pull_sources.py</text><text x="145" y="250" text-anchor="middle" class="k">fetched text fenced as DATA; never an instruction</text>
<rect x="20" y="20" width="250" height="46" rx="4" class="b"/><text x="145" y="40" text-anchor="middle" class="t">External: feeds, primary documents, NVD/KEV, NWS, ISOs</text><text x="145" y="56" text-anchor="middle" class="k">untrusted until graded</text>
<rect x="330" y="210" width="300" height="130" rx="4" class="b"/><text x="480" y="232" text-anchor="middle" class="t">Domain desks: 14 analytic residents</text><text x="480" y="252" text-anchor="middle" class="k">Reporter · Analyst · Critic · Wide-Angle · Contrarian · Librarian</text><text x="480" y="268" text-anchor="middle" class="k">Counsel · Archivist · Operator · Economist · Geopolitics · Technologist</text><text x="480" y="284" text-anchor="middle" class="k">Ombudsman (audits the desks) · Engineer (works on the code, PRs only)</text><text x="480" y="306" text-anchor="middle" class="k">typed outputs: schema records, scoring, anatomy, scenarios, brief</text><text x="480" y="324" text-anchor="middle" class="k">desks never fetch; they read the Reader's structured data</text>
<rect x="690" y="210" width="250" height="70" rx="4" class="b q"/><text x="815" y="232" text-anchor="middle" class="t">Auditor: the Verifier</text><text x="815" y="250" text-anchor="middle" class="k">independent input: stripped records + pulled text only</text><text x="815" y="266" text-anchor="middle" class="k">verdicts, cross-checks, ground-truth rate</text>
<rect x="330" y="390" width="300" height="70" rx="4" class="b p"/><text x="480" y="412" text-anchor="middle" class="t">Policy and Mandate Engine (deterministic)</text><text x="480" y="430" text-anchor="middle" class="k">RULES.md 1-39 · validate.py · computed severity · attribution rule</text><text x="480" y="446" text-anchor="middle" class="k">command_log.py flags every breach to the Incident Desk</text>
<rect x="330" y="510" width="300" height="70" rx="4" class="b"/><text x="480" y="532" text-anchor="middle" class="t">Event Ledger: briefing.json + append-only archive</text><text x="480" y="550" text-anchor="middle" class="k">docs/archive/&lt;run&gt;/ · history.json · STIX · engineering_log</text><text x="480" y="566" text-anchor="middle" class="k">nothing overwritten; the page only reads the ledger</text>
<rect x="690" y="390" width="250" height="70" rx="4" class="b"/><text x="815" y="412" text-anchor="middle" class="t">Consumers: the page and its tabs</text><text x="815" y="430" text-anchor="middle" class="k">Executive brief · Gazette · Risk check · Incident Desk · Bank</text><text x="815" y="446" text-anchor="middle" class="k">notifications bell · live chat (proxy or key)</text>
<rect x="690" y="510" width="250" height="70" rx="4" class="b h"/><text x="815" y="532" text-anchor="middle" class="t">Out of mandate → human</text><text x="815" y="550" text-anchor="middle" class="k">unsigned brief · Ombudsman proposals · Engineer PRs</text><text x="815" y="566" text-anchor="middle" class="k">blocked pages · 'I cannot verify this'</text>
<path class="e" d="M480 66V110"/><text x="488" y="92" class="l">intent, rules</text>
<path class="e" d="M145 66V110"/><text x="150" y="92" class="l">RSS, HTTP</text>
<path class="e" d="M145 166V210"/><text x="150" y="192" class="l">raw stories</text>
<path class="e" d="M270 238H330"/><text x="276" y="232" class="l">schema data</text>
<path class="e" d="M480 166V210"/><text x="488" y="192" class="l">tasks per desk</text>
<path class="e" d="M480 340V390"/><text x="488" y="368" class="l">proposed records</text>
<path class="e" d="M480 460V510"/><text x="488" y="488" class="l">allowed only</text>
<path class="e d" d="M690 245H630"/><text x="636" y="238" class="l">re-checks</text>
<path class="e" d="M630 540H690"/><text x="636" y="534" class="l">reads</text>
<path class="e" d="M630 420H690"/><text x="636" y="414" class="l">renders</text>
<path class="e d" d="M630 440 Q 660 480 690 530"/><text x="648" y="492" class="l">escalate</text>
<path class="e d" d="M815 580 Q 900 600 940 320 Q 940 60 630 38"/><text x="870" y="590" class="l">review, sign, merge</text>
<text x="20" y="605" class="k">Topology after yorkerhodes3/neocloud-supply-os, Appendix B1 (Conductor · desks · Auditor · Policy Engine · Ledger · Envoy · Reader). Green: deterministic code. Red: quarantine or independence. Amber: human.</text>
</svg>
