<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="100%" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12"><rect width="1180" height="640" fill="#0b0e14"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker></defs>
<style>.b{fill:#131824;stroke:#263042;stroke-width:2}.t{fill:#e6e9ef}.k{fill:#8b96a8;font-size:10px}.e{stroke:#9aa3b5;stroke-width:1.5;fill:none;marker-end:url(#a)}.d{stroke-dasharray:5 4}.l{fill:#9aa3b5;font-size:10px}.h{fill:#1a2233;stroke:#e8b04b}.q{fill:#1a1420;stroke:#e85a4b}.p{fill:#0f1a16;stroke:#4be89a}</style>
<rect x="400" y="10" width="360" height="56" rx="4" class="b h"/><text x="580" y="32" text-anchor="middle" class="t">Humans: the owner, who signs the brief</text><text x="580" y="50" text-anchor="middle" class="k">intent · rules, sources, personas · merge PRs · sign</text>
<rect x="400" y="110" width="360" height="56" rx="4" class="b"/><text x="580" y="132" text-anchor="middle" class="t">Conductor: the scheduled runtime</text><text x="580" y="150" text-anchor="middle" class="k">CURATION.md · routines 11:00 / 23:00 UTC · dry-run replay</text>
<rect x="20" y="110" width="340" height="56" rx="4" class="b p"/><text x="190" y="132" text-anchor="middle" class="t">Envoy gateway: fetch_news.py</text><text x="190" y="150" text-anchor="middle" class="k">allowlist only (sources.json, 38 feeds, 9 languages)</text>
<rect x="20" y="210" width="340" height="56" rx="4" class="b q"/><text x="190" y="232" text-anchor="middle" class="t">Reader (quarantined)</text><text x="190" y="250" text-anchor="middle" class="k">news.json + pull_sources.py; text fenced as DATA</text>
<rect x="20" y="20" width="340" height="46" rx="4" class="b"/><text x="190" y="40" text-anchor="middle" class="t">External sources</text><text x="190" y="56" text-anchor="middle" class="k">feeds, primary documents, NVD/KEV, NWS, ISOs: untrusted until graded</text>
<rect x="400" y="210" width="360" height="130" rx="4" class="b"/><text x="580" y="232" text-anchor="middle" class="t">Domain desks: 14 analytic residents</text><text x="580" y="252" text-anchor="middle" class="k">Reporter · Analyst · Critic · Wide-Angle · Contrarian</text><text x="580" y="268" text-anchor="middle" class="k">Librarian · Counsel · Archivist · Operator · Economist</text><text x="580" y="284" text-anchor="middle" class="k">Geopolitics · Technologist · Ombudsman · Engineer (PRs only)</text><text x="580" y="306" text-anchor="middle" class="k">typed outputs: schema records, scoring, anatomy, scenarios, brief</text><text x="580" y="324" text-anchor="middle" class="k">desks never fetch; they read the Reader's structured data</text>
<rect x="800" y="210" width="360" height="70" rx="4" class="b q"/><text x="980" y="232" text-anchor="middle" class="t">Auditor: the Verifier</text><text x="980" y="250" text-anchor="middle" class="k">independent input: stripped records + pulled text only</text><text x="980" y="266" text-anchor="middle" class="k">verdicts, cross-checks, ground-truth rate</text>
<rect x="400" y="390" width="360" height="70" rx="4" class="b p"/><text x="580" y="412" text-anchor="middle" class="t">Policy and Mandate Engine (code)</text><text x="580" y="430" text-anchor="middle" class="k">RULES.md 1-39 · validate.py · computed severity · attribution</text><text x="580" y="446" text-anchor="middle" class="k">command_log.py flags every breach to the Incident Desk</text>
<rect x="400" y="510" width="360" height="70" rx="4" class="b"/><text x="580" y="532" text-anchor="middle" class="t">Event Ledger</text><text x="580" y="550" text-anchor="middle" class="k">briefing.json · archive/&lt;run&gt; · history · STIX · eng. log</text><text x="580" y="566" text-anchor="middle" class="k">nothing overwritten; the page only reads the ledger</text>
<rect x="800" y="390" width="360" height="70" rx="4" class="b"/><text x="980" y="412" text-anchor="middle" class="t">Consumers: the page and its tabs</text><text x="980" y="430" text-anchor="middle" class="k">brief · Gazette · Risk check · Incident Desk · Bank</text><text x="980" y="446" text-anchor="middle" class="k">notifications bell · live chat (proxy or key)</text>
<rect x="800" y="510" width="360" height="70" rx="4" class="b h"/><text x="980" y="532" text-anchor="middle" class="t">Out of mandate → human</text><text x="980" y="550" text-anchor="middle" class="k">unsigned brief · Ombudsman proposals · Engineer PRs</text><text x="980" y="566" text-anchor="middle" class="k">blocked pages · 'I cannot verify this'</text>
<path class="e" d="M580 66V110"/><text x="588" y="92" class="l">intent, rules</text>
<path class="e" d="M190 66V110"/><text x="196" y="92" class="l">RSS, HTTP</text>
<path class="e" d="M190 166V210"/><text x="196" y="192" class="l">raw stories</text>
<path class="e" d="M360 238H400"/><text x="362" y="230" class="l">schema data</text>
<path class="e" d="M580 166V210"/><text x="588" y="192" class="l">tasks per desk</text>
<path class="e" d="M580 340V390"/><text x="588" y="368" class="l">proposed records</text>
<path class="e" d="M580 460V510"/><text x="588" y="488" class="l">allowed only</text>
<path class="e d" d="M800 245H760"/><text x="764" y="238" class="l">re-checks</text>
<path class="e" d="M760 540H800"/><text x="764" y="534" class="l">reads</text>
<path class="e" d="M760 420H800"/><text x="764" y="414" class="l">renders</text>
<path class="e d" d="M760 445 Q 780 490 800 530"/><text x="766" y="492" class="l">escalate</text>
<path class="e d" d="M980 580 Q 1170 600 1170 320 Q 1170 40 760 38"/><text x="1000" y="600" class="l">review, sign, merge</text>
<text x="20" y="628" class="k">After neocloud-supply-os, Appendix B1. Green: deterministic code. Red: quarantine or independence. Amber: human.</text>
</svg>
